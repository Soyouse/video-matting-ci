# La CI = `python ci.py`, la MÊME commande qu'en local. Ce fichier n'installe que l'outillage de chaque système
# et n'ajoute AUCUNE logique de test (règle du parc : un nom survit au fournisseur de CI, un script de CI non).
# Les runners GitHub n'ont pas de vraie carte graphique : on y prouve que le code TOURNE sur chaque système avec son
# fournisseur (CoreML sur Mac, WebGPU sur Linux via Vulkan logiciel lavapipe, DirectML sur Windows via WARP),
# jamais la vitesse, qui se mesure sur une vraie machine.
name: ci
on:
  push:
    branches: [master]
    paths: ['*.py', 'requirements-*.txt', '.github/workflows/ci.yml']  # dépôt PRIVÉ : Mac = minutes ×10, jamais sur un simple changement de doc
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            deps: requirements-macos.txt
          - os: ubuntu-24.04
            deps: requirements-linux.txt
          - os: windows-latest
            deps: requirements-windows.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — épinglé 2026-09-28
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 — épinglé 2026-09-28
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3.1 — épinglé 2026-09-28
        with:
          github-token: ${{ github.token }}
      - name: Vulkan logiciel (Linux sans carte graphique)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: python -m pip install -r ${{ matrix.deps }}
      - run: python ci.py
        env:
          PYTHONUTF8: '1'
